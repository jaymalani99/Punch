<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Punch Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Punch Tracker" />
<meta name="theme-color" content="#F5F7F8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --canvas:#F5F7F8; --surface:#FFFFFF; --ink:#1C2431; --inkmute:#5B6675; --line:#E4E8EC;
    --cng:#2E6E8E; --cng-light:#DCEAF0; --petrol:#B85C2C; --petrol-light:#F3E3D6;
    --service:#6B5CA5; --good:#2F8F5B; --warn:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--canvas); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .hidden{display:none !important;}
  .wrap{max-width:720px; margin:0 auto; padding:0 20px 64px;}
  .card{background:var(--surface); border-radius:18px; box-shadow:0 1px 2px rgba(28,36,49,.04), 0 8px 24px -12px rgba(28,36,49,.10); padding:20px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--inkmute);}
  input, select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff;}
  input:focus, select:focus{outline:none; border-color:var(--cng); box-shadow:0 0 0 3px rgba(46,110,142,.15);}
  label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--inkmute);}
  .btn{border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-primary:disabled{opacity:.6; cursor:default;}
  .btn-ghost{background:transparent; color:var(--inkmute); font-size:12px; font-weight:500;}
  .btn-ghost:hover{color:var(--ink); text-decoration:underline;}
  .btn-danger{background:transparent; color:var(--warn); font-size:12px; font-weight:500;}
  .btn-danger:hover{text-decoration:underline;}
  .toggle-row{display:flex; gap:8px;}
  .toggle{flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--canvas); color:var(--inkmute); font-weight:600; font-size:14px; cursor:pointer;}
  .toggle.active-cng{background:var(--cng); border-color:var(--cng); color:#fff;}
  .toggle.active-petrol{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .chip{padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--canvas); color:var(--inkmute); font-size:13px; font-weight:500; cursor:pointer;}
  .chip.active{background:var(--service); border-color:var(--service); color:#fff;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  header.top{position:sticky; top:0; z-index:5; background:rgba(245,247,248,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  header.top .inner{max-width:720px; margin:0 auto; padding:14px 20px 0;}
  header.top .row{display:flex; justify-content:space-between; align-items:flex-start;}
  nav.tabs{display:flex; gap:4px; padding:10px 0;}
  nav.tabs button{border:none; background:transparent; padding:7px 14px; border-radius:999px; font-size:14px; font-weight:500; color:var(--inkmute); cursor:pointer;}
  nav.tabs button.active{background:var(--ink); color:#fff;}
  .stat-card{background:var(--surface); border-radius:18px; box-shadow:0 1px 2px rgba(28,36,49,.04), 0 8px 24px -12px rgba(28,36,49,.10); padding:18px; min-width:0;}
  .stat-label{font-size:11px; font-weight:600; color:var(--inkmute); text-transform:uppercase; letter-spacing:.03em;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; margin-top:4px;}
  .stat-value .unit{font-size:14px; font-weight:500; color:var(--inkmute); margin-left:4px;}
  .stat-sub{font-size:11px; color:var(--inkmute); margin-top:2px;}
  .divider-list > div{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .divider-list > div:last-child{border-bottom:none;}
  .dot{width:10px; height:10px; border-radius:999px; flex-shrink:0;}
  .dot-cng{background:var(--cng);} .dot-petrol{background:var(--petrol);}
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  #login-screen .card{width:100%; max-width:360px;}
  .err{color:var(--warn); font-size:13px;}
  .muted-center{color:var(--inkmute); text-align:center; padding:24px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card stack">
    <div>
      <p class="eyebrow">Punch Tracker</p>
      <h1 class="display" style="font-size:22px; font-weight:700; margin:2px 0 0;">Enter to continue</h1>
    </div>
    <input id="login-input" type="password" placeholder="Password" autofocus />
    <p id="login-error" class="err hidden">Wrong password. Try again.</p>
    <button class="btn btn-primary" onclick="tryLogin()">Unlock</button>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="inner">
      <div class="row">
        <div>
          <p class="eyebrow">MH58 5278 · Tata Punch</p>
          <h1 class="display" style="font-size:19px; font-weight:700; margin:2px 0 0;">Punch Tracker</h1>
        </div>
        <button class="btn-ghost" onclick="logout()">Log out</button>
      </div>
      <nav class="tabs">
        <button data-tab="dashboard" class="active" onclick="showTab('dashboard')">Dashboard</button>
        <button data-tab="fuel" onclick="showTab('fuel')">Fuel</button>
        <button data-tab="service" onclick="showTab('service')">Service</button>
      </nav>
    </div>
  </header>

  <div class="wrap" style="padding-top:20px;">

    <section id="view-dashboard" class="stack"></section>

    <section id="view-fuel" class="stack hidden">
      <form id="fuel-form" class="card stack" onsubmit="return submitFuel(event)">
        <div class="row" style="display:flex; justify-content:space-between; align-items:center;">
          <p class="eyebrow" id="fuel-form-title">Log a fill-up</p>
          <button type="button" class="btn-ghost hidden" id="fuel-cancel-edit" onclick="cancelFuelEdit()">Cancel</button>
        </div>
        <div class="toggle-row">
          <button type="button" class="toggle active-cng" id="fuel-toggle-cng" onclick="setFuelType('CNG')">CNG</button>
          <button type="button" class="toggle" id="fuel-toggle-petrol" onclick="setFuelType('Petrol')">Petrol</button>
        </div>
        <div class="grid2">
          <label>Date <input type="date" id="fuel-date" /></label>
          <label>Odometer (km) <input type="number" id="fuel-odo" placeholder="e.g. 4210" /></label>
          <label><span id="fuel-qty-label">Quantity (kg)</span> <input type="number" step="0.01" id="fuel-qty" placeholder="0.00" /></label>
          <label>Cost (₹) <input type="number" step="0.01" id="fuel-cost" placeholder="0.00" /></label>
        </div>
        <label>Notes (optional) <input type="text" id="fuel-notes" placeholder="e.g. station name" /></label>
        <p id="fuel-error" class="err hidden"></p>
        <button class="btn btn-primary" id="fuel-submit-btn" type="submit">Save fill-up</button>
      </form>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:10px;">History</p>
        <div id="fuel-list" class="divider-list"></div>
      </div>
    </section>

    <section id="view-service" class="stack hidden">
      <form id="service-form" class="card stack" onsubmit="return submitService(event)">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <p class="eyebrow" id="service-form-title">Log service / repair</p>
          <button type="button" class="btn-ghost hidden" id="service-cancel-edit" onclick="cancelServiceEdit()">Cancel</button>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;" id="service-categories"></div>
        <div class="grid2">
          <label>Date <input type="date" id="service-date" /></label>
          <label>Odometer (km) <input type="number" id="service-odo" placeholder="e.g. 4210" /></label>
        </div>
        <label>Description <input type="text" id="service-desc" placeholder="e.g. 1st free service, brake pads" /></label>
        <label>Cost (₹) <input type="number" step="0.01" id="service-cost" placeholder="0.00" /></label>
        <p id="service-error" class="err hidden"></p>
        <button class="btn btn-primary" id="service-submit-btn" type="submit">Save entry</button>
      </form>

      <div class="card">
        <p class="eyebrow" style="margin-bottom:10px;">History</p>
        <div id="service-list" class="divider-list"></div>
      </div>
    </section>

  </div>
</div>

<script>
/* ====================== CONFIG — edit these three lines ====================== */
const SUPABASE_URL = "https://lcgfjvtalbuauqdtdfsf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H7tphASdS9hVTdDgnSEZ3g_8jjI2DWa";
const APP_PASSWORD = "1234";
/* =============================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let fuelLogs = [];
let serviceLogs = [];
let fuelType = "CNG";
let serviceCategory = "Service";
let editingFuelId = null;
let editingServiceId = null;

const SERVICE_CATEGORIES = ["Service", "Repair", "Tyres", "Insurance", "Other"];

/* ---------------- Auth (client-side gate) ---------------- */
function tryLogin(){
  const val = document.getElementById("login-input").value;
  if (val === APP_PASSWORD) {
    localStorage.setItem("ptr_unlocked", "1");
    boot();
  } else {
    document.getElementById("login-error").classList.remove("hidden");
  }
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !document.getElementById("login-screen").classList.contains("hidden")) tryLogin();
});
function logout(){
  localStorage.removeItem("ptr_unlocked");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");
}

/* ---------------- Tabs ---------------- */
function showTab(name){
  ["dashboard","fuel","service"].forEach(t => {
    document.getElementById("view-" + t).classList.toggle("hidden", t !== name);
  });
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === name);
  });
}

/* ---------------- Data loading ---------------- */
async function loadAll(){
  const [{ data: fuel }, { data: service }] = await Promise.all([
    sb.from("car_fuel_logs").select("*").order("odometer_km", { ascending: true }),
    sb.from("car_service_logs").select("*").order("odometer_km", { ascending: true }),
  ]);
  fuelLogs = fuel || [];
  serviceLogs = service || [];
  renderDashboard();
  renderFuelList();
  renderServiceList();
}

/* ---------------- Calculations ---------------- */
function mileagePoints(){
  const sorted = [...fuelLogs].sort((a,b) => a.odometer_km - b.odometer_km);
  const points = [];
  for (let i = 1; i < sorted.length; i++){
    const prev = sorted[i-1], curr = sorted[i];
    const km = curr.odometer_km - prev.odometer_km;
    if (km <= 0 || curr.quantity <= 0) continue;
    points.push({ fuel_type: curr.fuel_type, km, quantity: curr.quantity, cost: curr.cost });
  }
  return points;
}
function avgMileageByType(points, type){
  const f = points.filter(p => p.fuel_type === type);
  if (!f.length) return null;
  const km = f.reduce((s,p)=>s+p.km,0), qty = f.reduce((s,p)=>s+p.quantity,0);
  return qty > 0 ? km/qty : null;
}
function avgCostPerKm(points){
  if (!points.length) return null;
  const km = points.reduce((s,p)=>s+p.km,0), cost = points.reduce((s,p)=>s+p.cost,0);
  return km > 0 ? cost/km : null;
}
function totalKmDriven(){
  const sorted = [...fuelLogs].sort((a,b)=>a.odometer_km-b.odometer_km);
  if (sorted.length < 2) return 0;
  return sorted[sorted.length-1].odometer_km - sorted[0].odometer_km;
}
function currentOdometer(){
  const all = [...fuelLogs.map(f=>f.odometer_km), ...serviceLogs.map(s=>s.odometer_km)];
  return all.length ? Math.max(...all) : 0;
}
function monthKey(d){ return d.slice(0,7); }
function monthlySummaries(){
  const sorted = [...fuelLogs].sort((a,b)=>a.odometer_km-b.odometer_km);
  const map = new Map();
  const ensure = m => { if(!map.has(m)) map.set(m,{month:m,km:0,fuelSpend:0,serviceSpend:0}); return map.get(m); };
  for (let i=1;i<sorted.length;i++){
    const prev=sorted[i-1], curr=sorted[i];
    const km = curr.odometer_km - prev.odometer_km;
    if (km<=0) continue;
    ensure(monthKey(curr.entry_date)).km += km;
  }
  fuelLogs.forEach(f => ensure(monthKey(f.entry_date)).fuelSpend += f.cost);
  serviceLogs.forEach(s => ensure(monthKey(s.entry_date)).serviceSpend += s.cost);
  return [...map.values()].sort((a,b)=> a.month < b.month ? 1 : -1);
}
function fuelSplit(logs){
  const cng = logs.filter(f=>f.fuel_type==="CNG").reduce((s,f)=>s+f.cost,0);
  const petrol = logs.filter(f=>f.fuel_type==="Petrol").reduce((s,f)=>s+f.cost,0);
  const total = cng+petrol;
  return { cng, petrol, cngPct: total? Math.round(cng/total*100):0, petrolPct: total? Math.round(petrol/total*100):0 };
}
function inr(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }

/* ---------------- Dashboard render ---------------- */
function renderDashboard(){
  const el = document.getElementById("view-dashboard");
  if (!fuelLogs.length){
    el.innerHTML = `<div class="card muted-center"><p class="display" style="font-weight:700; color:var(--ink); margin-bottom:4px;">No entries yet</p><p>Log your first fill-up to see your stats here.</p></div>`;
    return;
  }
  const points = mileagePoints();
  const cngMileage = avgMileageByType(points, "CNG");
  const petrolMileage = avgMileageByType(points, "Petrol");
  const costPerKm = avgCostPerKm(points);
  const km = totalKmDriven();
  const odo = currentOdometer();
  const months = monthlySummaries();
  const fuelCost = fuelLogs.reduce((s,l)=>s+l.cost,0);
  const serviceCost = serviceLogs.reduce((s,l)=>s+l.cost,0);
  const costPerKmAll = km>0 ? (fuelCost+serviceCost)/km : null;

  const thisMonth = new Date().toISOString().slice(0,7);
  const thisMonthFuel = fuelLogs.filter(f => monthKey(f.entry_date) === thisMonth);
  const split = fuelSplit(thisMonthFuel);
  const thisMonthSpend = split.cng + split.petrol;

  const stat = (label, value, unit, sub) => `
    <div class="stat-card">
      <p class="stat-label">${label}</p>
      <p class="stat-value">${value}${unit ? `<span class="unit">${unit}</span>` : ""}</p>
      ${sub ? `<p class="stat-sub">${sub}</p>` : ""}
    </div>`;

  el.innerHTML = `
    ${gaugeCard(split, "this month", thisMonthSpend)}
    <div class="grid2">
      ${stat("Odometer", odo.toLocaleString("en-IN"), "km")}
      ${stat("Total driven", km.toLocaleString("en-IN"), "km")}
      ${stat("CNG mileage", cngMileage ? cngMileage.toFixed(1) : "—", cngMileage ? "km/kg" : "")}
      ${stat("Petrol mileage", petrolMileage ? petrolMileage.toFixed(1) : "—", petrolMileage ? "km/L" : "")}
      ${stat("Avg fuel cost", costPerKm ? costPerKm.toFixed(2) : "—", costPerKm ? "₹/km" : "")}
      ${stat("True cost / km", costPerKmAll ? costPerKmAll.toFixed(2) : "—", costPerKmAll ? "₹/km" : "", "fuel + service")}
      ${stat("Total fuel spend", inr(fuelCost))}
      ${stat("Total service/repair", inr(serviceCost))}
    </div>
    <div class="card">
      <p class="eyebrow" style="margin-bottom:10px;">Monthly breakdown</p>
      <div class="divider-list">
        ${months.map(m => `
          <div>
            <span style="font-weight:600;">${m.month}</span>
            <span style="color:var(--inkmute);">${m.km.toLocaleString("en-IN")} km</span>
            <span class="mono" style="font-weight:600;">${inr(m.fuelSpend + m.serviceSpend)}</span>
          </div>`).join("")}
      </div>
    </div>
  `;
}

function gaugeCard(split, monthLabel, totalSpend){
  const has = split.cngPct + split.petrolPct > 0;
  return `
  <div class="card" style="display:flex; flex-direction:column; align-items:center;">
    <p class="eyebrow" style="align-self:flex-start; margin-bottom:6px;">Fuel mix · ${monthLabel}</p>
    <svg viewBox="0 0 200 110" style="width:100%; max-width:280px;">
      <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#E4E8EC" stroke-width="14" stroke-linecap="round" pathLength="100"/>
      ${has ? `
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#2E6E8E" stroke-width="14" stroke-linecap="round" pathLength="100"
          stroke-dasharray="${split.cngPct} ${100-split.cngPct}" stroke-dashoffset="0"/>
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#B85C2C" stroke-width="14" stroke-linecap="round" pathLength="100"
          stroke-dasharray="${split.petrolPct} ${100-split.petrolPct}" stroke-dashoffset="${-split.cngPct}"/>
      ` : ""}
      <text x="100" y="90" text-anchor="middle" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#1C2431">
        ${has ? inr(totalSpend) : "No data"}
      </text>
    </svg>
    <div style="display:flex; gap:24px; margin-top:4px;">
      <span style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--inkmute);"><span class="dot dot-cng"></span>CNG <strong style="color:var(--ink);">${split.cngPct}%</strong></span>
      <span style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--inkmute);"><span class="dot dot-petrol"></span>Petrol <strong style="color:var(--ink);">${split.petrolPct}%</strong></span>
    </div>
  </div>`;
}

/* ---------------- Fuel form ---------------- */
function setFuelType(t){
  fuelType = t;
  document.getElementById("fuel-toggle-cng").classList.toggle("active-cng", t==="CNG");
  document.getElementById("fuel-toggle-petrol").classList.toggle("active-petrol", t==="Petrol");
  document.getElementById("fuel-qty-label").textContent = t==="CNG" ? "Quantity (kg)" : "Quantity (L)";
}
function resetFuelForm(){
  document.getElementById("fuel-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("fuel-odo").value = "";
  document.getElementById("fuel-qty").value = "";
  document.getElementById("fuel-cost").value = "";
  document.getElementById("fuel-notes").value = "";
  setFuelType("CNG");
}
function cancelFuelEdit(){
  editingFuelId = null;
  document.getElementById("fuel-form-title").textContent = "Log a fill-up";
  document.getElementById("fuel-submit-btn").textContent = "Save fill-up";
  document.getElementById("fuel-cancel-edit").classList.add("hidden");
  resetFuelForm();
}
function startFuelEdit(id){
  const l = fuelLogs.find(f => f.id === id);
  if (!l) return;
  editingFuelId = id;
  document.getElementById("fuel-form-title").textContent = "Edit fill-up";
  document.getElementById("fuel-submit-btn").textContent = "Update fill-up";
  document.getElementById("fuel-cancel-edit").classList.remove("hidden");
  document.getElementById("fuel-date").value = l.entry_date;
  document.getElementById("fuel-odo").value = l.odometer_km;
  document.getElementById("fuel-qty").value = l.quantity;
  document.getElementById("fuel-cost").value = l.cost;
  document.getElementById("fuel-notes").value = l.notes || "";
  setFuelType(l.fuel_type);
  showTab("fuel");
  window.scrollTo({top:0, behavior:"smooth"});
}
async function submitFuel(e){
  e.preventDefault();
  const errEl = document.getElementById("fuel-error");
  errEl.classList.add("hidden");
  const odo = Number(document.getElementById("fuel-odo").value);
  const qty = Number(document.getElementById("fuel-qty").value);
  const cost = Number(document.getElementById("fuel-cost").value);
  const date = document.getElementById("fuel-date").value;
  const notes = document.getElementById("fuel-notes").value || null;
  if (!odo || !qty || !cost){
    errEl.textContent = "Odometer, quantity and cost are required.";
    errEl.classList.remove("hidden");
    return false;
  }
  const lastOdo = fuelLogs.length ? Math.max(...fuelLogs.map(f=>f.odometer_km)) : 0;
  if (!editingFuelId && lastOdo && odo < lastOdo){
    errEl.textContent = `Odometer can't be less than your last reading (${lastOdo} km).`;
    errEl.classList.remove("hidden");
    return false;
  }
  const payload = { entry_date: date, odometer_km: odo, fuel_type: fuelType, quantity: qty, cost, notes };
  const btn = document.getElementById("fuel-submit-btn");
  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = editingFuelId
    ? await sb.from("car_fuel_logs").update(payload).eq("id", editingFuelId)
    : await sb.from("car_fuel_logs").insert(payload);
  btn.disabled = false;
  if (error){
    errEl.textContent = error.message;
    errEl.classList.remove("hidden");
    btn.textContent = editingFuelId ? "Update fill-up" : "Save fill-up";
    return false;
  }
  cancelFuelEdit();
  await loadAll();
  return false;
}
async function deleteFuel(id){
  if (editingFuelId === id) cancelFuelEdit();
  await sb.from("car_fuel_logs").delete().eq("id", id);
  loadAll();
}
function renderFuelList(){
  const el = document.getElementById("fuel-list");
  if (!fuelLogs.length){ el.innerHTML = `<p style="color:var(--inkmute); font-size:14px;">No fill-ups logged yet.</p>`; return; }
  const sorted = [...fuelLogs].sort((a,b)=>b.odometer_km-a.odometer_km);
  el.innerHTML = sorted.map(l => `
    <div>
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <span class="dot ${l.fuel_type==='CNG'?'dot-cng':'dot-petrol'}"></span>
        <div style="min-width:0;">
          <p style="font-size:14px; font-weight:600; margin:0;">${l.fuel_type} · ${l.quantity}${l.fuel_type==='CNG'?'kg':'L'}</p>
          <p style="font-size:12px; color:var(--inkmute); margin:2px 0 0;">${l.entry_date} · ${l.odometer_km.toLocaleString("en-IN")} km</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
        <span class="mono" style="font-size:14px; font-weight:600;">${inr(l.cost)}</span>
        <button class="btn-ghost" onclick="startFuelEdit('${l.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteFuel('${l.id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

/* ---------------- Service form ---------------- */
function renderServiceCategories(){
  const el = document.getElementById("service-categories");
  el.innerHTML = SERVICE_CATEGORIES.map(c =>
    `<button type="button" class="chip ${c===serviceCategory?'active':''}" onclick="setServiceCategory('${c}')">${c}</button>`
  ).join("");
}
function setServiceCategory(c){ serviceCategory = c; renderServiceCategories(); }
function resetServiceForm(){
  document.getElementById("service-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("service-odo").value = "";
  document.getElementById("service-desc").value = "";
  document.getElementById("service-cost").value = "";
  setServiceCategory("Service");
}
function cancelServiceEdit(){
  editingServiceId = null;
  document.getElementById("service-form-title").textContent = "Log service / repair";
  document.getElementById("service-submit-btn").textContent = "Save entry";
  document.getElementById("service-cancel-edit").classList.add("hidden");
  resetServiceForm();
}
function startServiceEdit(id){
  const l = serviceLogs.find(s => s.id === id);
  if (!l) return;
  editingServiceId = id;
  document.getElementById("service-form-title").textContent = "Edit entry";
  document.getElementById("service-submit-btn").textContent = "Update entry";
  document.getElementById("service-cancel-edit").classList.remove("hidden");
  document.getElementById("service-date").value = l.entry_date;
  document.getElementById("service-odo").value = l.odometer_km;
  document.getElementById("service-desc").value = l.description;
  document.getElementById("service-cost").value = l.cost;
  setServiceCategory(l.category);
  showTab("service");
  window.scrollTo({top:0, behavior:"smooth"});
}
async function submitService(e){
  e.preventDefault();
  const errEl = document.getElementById("service-error");
  errEl.classList.add("hidden");
  const odo = Number(document.getElementById("service-odo").value);
  const cost = Number(document.getElementById("service-cost").value);
  const date = document.getElementById("service-date").value;
  const description = document.getElementById("service-desc").value;
  if (!odo || !cost || !description){
    errEl.textContent = "Odometer, description and cost are required.";
    errEl.classList.remove("hidden");
    return false;
  }
  const payload = { entry_date: date, odometer_km: odo, category: serviceCategory, description, cost };
  const btn = document.getElementById("service-submit-btn");
  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = editingServiceId
    ? await sb.from("car_service_logs").update(payload).eq("id", editingServiceId)
    : await sb.from("car_service_logs").insert(payload);
  btn.disabled = false;
  if (error){
    errEl.textContent = error.message;
    errEl.classList.remove("hidden");
    btn.textContent = editingServiceId ? "Update entry" : "Save entry";
    return false;
  }
  cancelServiceEdit();
  await loadAll();
  return false;
}
async function deleteService(id){
  if (editingServiceId === id) cancelServiceEdit();
  await sb.from("car_service_logs").delete().eq("id", id);
  loadAll();
}
function renderServiceList(){
  const el = document.getElementById("service-list");
  if (!serviceLogs.length){ el.innerHTML = `<p style="color:var(--inkmute); font-size:14px;">No service or repair entries yet.</p>`; return; }
  const sorted = [...serviceLogs].sort((a,b)=>b.odometer_km-a.odometer_km);
  el.innerHTML = sorted.map(l => `
    <div>
      <div style="min-width:0;">
        <p style="font-size:14px; font-weight:600; margin:0;">${l.category} · ${l.description}</p>
        <p style="font-size:12px; color:var(--inkmute); margin:2px 0 0;">${l.entry_date} · ${l.odometer_km.toLocaleString("en-IN")} km</p>
      </div>
      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
        <span class="mono" style="font-size:14px; font-weight:600;">${inr(l.cost)}</span>
        <button class="btn-ghost" onclick="startServiceEdit('${l.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteService('${l.id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

/* ---------------- Boot ---------------- */
function boot(){
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  resetFuelForm();
  renderServiceCategories();
  resetServiceForm();
  loadAll();
}
if (localStorage.getItem("ptr_unlocked") === "1") boot();
</script>
</body>
</html>
