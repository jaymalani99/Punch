<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Punch Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Punch Tracker" />
<meta name="theme-color" content="#F5F7F8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --canvas:#F5F7F8; --surface:#FFFFFF; --ink:#1C2431; --inkmute:#5B6675; --line:#E4E8EC;
    --cng:#2E6E8E; --cng-light:#DCEAF0; --petrol:#B85C2C; --petrol-light:#F3E3D6;
    --service:#6B5CA5; --good:#2F8F5B; --warn:#C0392B;
    --sidebar-w:220px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--canvas); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .hidden{display:none !important;}
  .card{background:var(--surface); border-radius:18px; box-shadow:0 1px 2px rgba(28,36,49,.04), 0 8px 24px -12px rgba(28,36,49,.10); padding:20px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--inkmute);}
  input, select{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff;}
  input:focus, select:focus{outline:none; border-color:var(--cng); box-shadow:0 0 0 3px rgba(46,110,142,.15);}
  label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--inkmute);}
  .btn{border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-primary:disabled{opacity:.6; cursor:default;}
  .btn-ghost{background:transparent; color:var(--inkmute); font-size:12px; font-weight:500; border:none; cursor:pointer; font-family:inherit; padding:0;}
  .btn-ghost:hover{color:var(--ink); text-decoration:underline;}
  .btn-danger{background:transparent; color:var(--warn); font-size:12px; font-weight:500; border:none; cursor:pointer; font-family:inherit; padding:0;}
  .btn-danger:hover{text-decoration:underline;}
  .toggle-row{display:flex; gap:8px;}
  .toggle{flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--canvas); color:var(--inkmute); font-weight:600; font-size:14px; cursor:pointer;}
  .toggle.active-cng{background:var(--cng); border-color:var(--cng); color:#fff;}
  .toggle.active-petrol{background:var(--petrol); border-color:var(--petrol); color:#fff;}
  .chip{padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--canvas); color:var(--inkmute); font-size:13px; font-weight:500; cursor:pointer;}
  .chip.active{background:var(--service); border-color:var(--service); color:#fff;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  .stack-sm{display:flex; flex-direction:column; gap:10px;}

  /* ---- layout: sidebar + main ---- */
  .layout{display:flex; min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--line);
    padding:18px 14px; position:fixed; top:0; left:0; bottom:0; z-index:30;
    display:flex; flex-direction:column; transform:translateX(-100%); transition:transform .22s ease;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar .brand{padding:4px 10px 18px;}
  .sidebar .brand .plate{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.15em; color:var(--inkmute); text-transform:uppercase;}
  .sidebar .brand .name{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; margin-top:2px;}
  .navlink{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:12px; color:var(--inkmute); font-weight:500; font-size:14px; text-decoration:none; cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-family:inherit;}
  .navlink svg{flex-shrink:0;}
  .navlink:hover{background:var(--canvas); color:var(--ink);}
  .navlink.active{background:var(--ink); color:#fff;}
  .sidebar .navgroup{display:flex; flex-direction:column; gap:2px;}
  .sidebar .spacer{flex:1;}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(28,36,49,.35); z-index:25; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .sidebar-overlay.show{opacity:1; pointer-events:auto;}

  .main{flex:1; min-width:0;}
  .topbar{position:sticky; top:0; z-index:10; background:rgba(245,247,248,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:14px 20px;}
  .hamburger{background:var(--surface); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .topbar .page-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
  #fuel-edit-form, #service-edit-form{scroll-margin-top:76px;}

  @media(min-width:880px){
    .sidebar{transform:translateX(0); position:sticky;}
    .sidebar-overlay{display:none;}
    .main{margin-left:0;}
    .hamburger{display:none;}
  }

  .wrap{max-width:640px; margin:0 auto; padding:20px 20px 64px;}

  .stat-card{background:var(--surface); border-radius:16px; box-shadow:0 1px 2px rgba(28,36,49,.04), 0 8px 24px -12px rgba(28,36,49,.10); padding:14px 16px; min-width:0;}
  .stat-label{font-size:10.5px; font-weight:600; color:var(--inkmute); text-transform:uppercase; letter-spacing:.03em;}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:700; margin-top:3px;}
  .stat-value .unit{font-size:12px; font-weight:500; color:var(--inkmute); margin-left:3px;}
  .stat-sub{font-size:10.5px; color:var(--inkmute); margin-top:1px;}
  .divider-list > div{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .divider-list > div:last-child{border-bottom:none;}
  .dot{width:10px; height:10px; border-radius:999px; flex-shrink:0;}
  .dot-cng{background:var(--cng);} .dot-petrol{background:var(--petrol);}
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  #login-screen .card{width:100%; max-width:360px;}
  .err{color:var(--warn); font-size:13px;}
  .muted-center{color:var(--inkmute); text-align:center; padding:24px;}
  .section-title{display:flex; justify-content:space-between; align-items:center;}
  .link-inline{color:var(--cng); font-size:12px; font-weight:600; cursor:pointer; background:none; border:none; font-family:inherit; padding:0;}
  .link-inline:hover{text-decoration:underline;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card stack">
    <div>
      <p class="eyebrow">Punch Tracker</p>
      <h1 class="display" style="font-size:22px; font-weight:700; margin:2px 0 0;">Enter to continue</h1>
    </div>
    <input id="login-input" type="password" placeholder="Password" autofocus />
    <p id="login-error" class="err hidden">Wrong password. Try again.</p>
    <button class="btn btn-primary" onclick="tryLogin()">Unlock</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="layout">

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <p class="plate">MH58 5278 · Tata Punch</p>
        <p class="name">Punch Tracker</p>
      </div>
      <nav class="navgroup">
        <button class="navlink active" data-view="home" onclick="showView('home')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Home
        </button>
        <button class="navlink" data-view="fuel" onclick="showView('fuel')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V8a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M3 22h10"/><path d="M13 9h2l3 3v6a2 2 0 0 1-2 2h-1"/><circle cx="7" cy="14" r="1.5"/></svg>
          Fuel log
        </button>
        <button class="navlink" data-view="service" onclick="showView('service')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L2 19v3h3l7.3-7.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>
          Service log
        </button>
      </nav>
      <div class="spacer"></div>
      <button class="navlink" onclick="logout()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </button>
    </aside>

    <div class="main">
      <div class="topbar">
        <button class="hamburger" onclick="openSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="page-title" id="page-title">Home</span>
      </div>

      <div class="wrap">

        <!-- HOME -->
        <section id="view-home" class="stack">
          <div id="home-stats"></div>

          <form id="fuel-add-form" class="card stack-sm" onsubmit="return submitFuelAdd(event)">
            <p class="eyebrow">Log a fill-up</p>
            <div class="toggle-row">
              <button type="button" class="toggle active-cng" id="fueladd-toggle-cng" onclick="setAddFuelType('CNG')">CNG</button>
              <button type="button" class="toggle" id="fueladd-toggle-petrol" onclick="setAddFuelType('Petrol')">Petrol</button>
            </div>
            <div class="grid2">
              <label>Date <input type="date" id="fueladd-date" /></label>
              <label>Odometer (km) <input type="number" id="fueladd-odo" placeholder="e.g. 4210" /></label>
              <label><span id="fueladd-qty-label">Quantity (kg)</span> <input type="number" step="0.01" id="fueladd-qty" placeholder="0.00" /></label>
              <label>Cost (₹) <input type="number" step="0.01" id="fueladd-cost" placeholder="0.00" /></label>
            </div>
            <label>Notes (optional) <input type="text" id="fueladd-notes" placeholder="e.g. station name" /></label>
            <p id="fueladd-error" class="err hidden"></p>
            <button class="btn btn-primary" id="fueladd-submit-btn" type="submit">Save fill-up</button>
          </form>

          <form id="service-add-form" class="card stack-sm" onsubmit="return submitServiceAdd(event)">
            <p class="eyebrow">Log service / repair</p>
            <div style="display:flex; flex-wrap:wrap; gap:8px;" id="serviceadd-categories"></div>
            <div class="grid2">
              <label>Date <input type="date" id="serviceadd-date" /></label>
              <label>Odometer (km) <input type="number" id="serviceadd-odo" placeholder="e.g. 4210" /></label>
            </div>
            <label>Description <input type="text" id="serviceadd-desc" placeholder="e.g. 1st free service, brake pads" /></label>
            <label>Cost (₹) <input type="number" step="0.01" id="serviceadd-cost" placeholder="0.00" /></label>
            <p id="serviceadd-error" class="err hidden"></p>
            <button class="btn btn-primary" id="serviceadd-submit-btn" type="submit">Save entry</button>
          </form>
        </section>

        <!-- FUEL LOG -->
        <section id="view-fuel" class="stack hidden">
          <div class="section-title">
            <p class="eyebrow" style="margin:0;">All fill-ups</p>
            <button class="link-inline" onclick="showView('home')">+ Add a fill-up</button>
          </div>

          <form id="fuel-edit-form" class="card stack-sm hidden" onsubmit="return submitFuelEdit(event)">
            <div class="section-title">
              <p class="eyebrow" style="margin:0;">Edit fill-up</p>
              <button type="button" class="btn-ghost" onclick="cancelFuelEdit()">Cancel</button>
            </div>
            <div class="toggle-row">
              <button type="button" class="toggle active-cng" id="fueledit-toggle-cng" onclick="setEditFuelType('CNG')">CNG</button>
              <button type="button" class="toggle" id="fueledit-toggle-petrol" onclick="setEditFuelType('Petrol')">Petrol</button>
            </div>
            <div class="grid2">
              <label>Date <input type="date" id="fueledit-date" /></label>
              <label>Odometer (km) <input type="number" id="fueledit-odo" /></label>
              <label><span id="fueledit-qty-label">Quantity (kg)</span> <input type="number" step="0.01" id="fueledit-qty" /></label>
              <label>Cost (₹) <input type="number" step="0.01" id="fueledit-cost" /></label>
            </div>
            <label>Notes (optional) <input type="text" id="fueledit-notes" /></label>
            <p id="fueledit-error" class="err hidden"></p>
            <button class="btn btn-primary" id="fueledit-submit-btn" type="submit">Update fill-up</button>
          </form>

          <div class="card">
            <div id="fuel-list" class="divider-list"></div>
          </div>

          <div class="card" id="monthly-card">
            <p class="eyebrow" style="margin-bottom:10px;">Monthly breakdown</p>
            <div id="monthly-list" class="divider-list"></div>
          </div>
        </section>

        <!-- SERVICE LOG -->
        <section id="view-service" class="stack hidden">
          <div class="section-title">
            <p class="eyebrow" style="margin:0;">All service &amp; repairs</p>
            <button class="link-inline" onclick="showView('home')">+ Add an entry</button>
          </div>

          <form id="service-edit-form" class="card stack-sm hidden" onsubmit="return submitServiceEdit(event)">
            <div class="section-title">
              <p class="eyebrow" style="margin:0;">Edit entry</p>
              <button type="button" class="btn-ghost" onclick="cancelServiceEdit()">Cancel</button>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;" id="serviceedit-categories"></div>
            <div class="grid2">
              <label>Date <input type="date" id="serviceedit-date" /></label>
              <label>Odometer (km) <input type="number" id="serviceedit-odo" /></label>
            </div>
            <label>Description <input type="text" id="serviceedit-desc" /></label>
            <label>Cost (₹) <input type="number" step="0.01" id="serviceedit-cost" /></label>
            <p id="serviceedit-error" class="err hidden"></p>
            <button class="btn btn-primary" id="serviceedit-submit-btn" type="submit">Update entry</button>
          </form>

          <div class="card">
            <div id="service-list" class="divider-list"></div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<script>
/* ====================== CONFIG — edit these three lines ====================== */
const SUPABASE_URL = "https://lcgfjvtalbuauqdtdfsf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H7tphASdS9hVTdDgnSEZ3g_8jjI2DWa";
const APP_PASSWORD = "1234";
/* =============================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let fuelLogs = [];
let serviceLogs = [];
let addFuelType = "CNG";
let editFuelType = "CNG";
let addServiceCategory = "Service";
let editServiceCategory = "Service";
let editingFuelId = null;
let editingServiceId = null;

const SERVICE_CATEGORIES = ["Service", "Repair", "Tyres", "Insurance", "Other"];
const PAGE_TITLES = { home: "Home", fuel: "Fuel log", service: "Service log" };

/* ---------------- Auth (client-side gate) ---------------- */
function tryLogin(){
  const val = document.getElementById("login-input").value;
  if (val === APP_PASSWORD) {
    localStorage.setItem("ptr_unlocked", "1");
    boot();
  } else {
    document.getElementById("login-error").classList.remove("hidden");
  }
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !document.getElementById("login-screen").classList.contains("hidden")) tryLogin();
});
function logout(){
  localStorage.removeItem("ptr_unlocked");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");
}

/* ---------------- Sidebar / views ---------------- */
function openSidebar(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-overlay").classList.add("show");
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("show");
}
function showView(name){
  ["home","fuel","service"].forEach(v => {
    document.getElementById("view-" + v).classList.toggle("hidden", v !== name);
  });
  document.querySelectorAll(".navlink[data-view]").forEach(b => {
    b.classList.toggle("active", b.dataset.view === name);
  });
  document.getElementById("page-title").textContent = PAGE_TITLES[name];
  closeSidebar();
  window.scrollTo({top:0});
}

/* ---------------- Data loading ---------------- */
async function loadAll(){
  const [{ data: fuel }, { data: service }] = await Promise.all([
    sb.from("car_fuel_logs").select("*").order("odometer_km", { ascending: true }),
    sb.from("car_service_logs").select("*").order("odometer_km", { ascending: true }),
  ]);
  fuelLogs = fuel || [];
  serviceLogs = service || [];
  renderHome();
  renderFuelList();
  renderServiceList();
  renderMonthly();
}

/* ---------------- Calculations ---------------- */
function mileagePoints(){
  const sorted = [...fuelLogs].sort((a,b) => a.odometer_km - b.odometer_km);
  const points = [];
  for (let i = 1; i < sorted.length; i++){
    const prev = sorted[i-1], curr = sorted[i];
    const km = curr.odometer_km - prev.odometer_km;
    if (km <= 0 || curr.quantity <= 0) continue;
    points.push({ fuel_type: curr.fuel_type, km, quantity: curr.quantity, cost: curr.cost });
  }
  return points;
}
function avgMileageByType(points, type){
  const f = points.filter(p => p.fuel_type === type);
  if (!f.length) return null;
  const km = f.reduce((s,p)=>s+p.km,0), qty = f.reduce((s,p)=>s+p.quantity,0);
  return qty > 0 ? km/qty : null;
}
function avgCostPerKm(points){
  if (!points.length) return null;
  const km = points.reduce((s,p)=>s+p.km,0), cost = points.reduce((s,p)=>s+p.cost,0);
  return km > 0 ? cost/km : null;
}
function totalKmDriven(){
  const sorted = [...fuelLogs].sort((a,b)=>a.odometer_km-b.odometer_km);
  if (sorted.length < 2) return 0;
  return sorted[sorted.length-1].odometer_km - sorted[0].odometer_km;
}
function currentOdometer(){
  const all = [...fuelLogs.map(f=>f.odometer_km), ...serviceLogs.map(s=>s.odometer_km)];
  return all.length ? Math.max(...all) : 0;
}
function monthKey(d){ return d.slice(0,7); }
function monthlySummaries(){
  const sorted = [...fuelLogs].sort((a,b)=>a.odometer_km-b.odometer_km);
  const map = new Map();
  const ensure = m => { if(!map.has(m)) map.set(m,{month:m,km:0,fuelSpend:0,serviceSpend:0}); return map.get(m); };
  for (let i=1;i<sorted.length;i++){
    const prev=sorted[i-1], curr=sorted[i];
    const km = curr.odometer_km - prev.odometer_km;
    if (km<=0) continue;
    ensure(monthKey(curr.entry_date)).km += km;
  }
  fuelLogs.forEach(f => ensure(monthKey(f.entry_date)).fuelSpend += f.cost);
  serviceLogs.forEach(s => ensure(monthKey(s.entry_date)).serviceSpend += s.cost);
  return [...map.values()].sort((a,b)=> a.month < b.month ? 1 : -1);
}
function fuelSplit(logs){
  const cng = logs.filter(f=>f.fuel_type==="CNG").reduce((s,f)=>s+f.cost,0);
  const petrol = logs.filter(f=>f.fuel_type==="Petrol").reduce((s,f)=>s+f.cost,0);
  const total = cng+petrol;
  return { cng, petrol, cngPct: total? Math.round(cng/total*100):0, petrolPct: total? Math.round(petrol/total*100):0 };
}
function inr(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }

/* ---------------- Home render (compact preview) ---------------- */
function renderHome(){
  const el = document.getElementById("home-stats");
  if (!fuelLogs.length){
    el.innerHTML = `<div class="card muted-center"><p class="display" style="font-weight:700; color:var(--ink); margin-bottom:4px;">No entries yet</p><p>Log your first fill-up below to see your stats here.</p></div>`;
    return;
  }
  const points = mileagePoints();
  const costPerKm = avgCostPerKm(points);
  const km = totalKmDriven();
  const odo = currentOdometer();
  const fuelCost = fuelLogs.reduce((s,l)=>s+l.cost,0);
  const serviceCost = serviceLogs.reduce((s,l)=>s+l.cost,0);
  const costPerKmAll = km>0 ? (fuelCost+serviceCost)/km : null;

  const thisMonth = new Date().toISOString().slice(0,7);
  const thisMonthFuel = fuelLogs.filter(f => monthKey(f.entry_date) === thisMonth);
  const split = fuelSplit(thisMonthFuel);
  const thisMonthSpend = split.cng + split.petrol;

  const stat = (label, value, unit, sub) => `
    <div class="stat-card">
      <p class="stat-label">${label}</p>
      <p class="stat-value">${value}${unit ? `<span class="unit">${unit}</span>` : ""}</p>
      ${sub ? `<p class="stat-sub">${sub}</p>` : ""}
    </div>`;

  el.innerHTML = `
    <div class="stack" style="gap:12px;">
      ${gaugeCard(split, "this month", thisMonthSpend)}
      <div class="grid2">
        ${stat("Odometer", odo.toLocaleString("en-IN"), "km")}
        ${stat("Total driven", km.toLocaleString("en-IN"), "km")}
        ${stat("True cost / km", costPerKmAll ? costPerKmAll.toFixed(2) : "—", costPerKmAll ? "₹/km" : "", "fuel + service")}
        ${stat("Fuel cost / km", costPerKm ? costPerKm.toFixed(2) : "—", costPerKm ? "₹/km" : "")}
      </div>
    </div>
  `;
}

function gaugeCard(split, monthLabel, totalSpend){
  const has = split.cngPct + split.petrolPct > 0;
  return `
  <div class="card" style="display:flex; flex-direction:column; align-items:center; padding:16px;">
    <p class="eyebrow" style="align-self:flex-start; margin-bottom:4px;">Fuel mix · ${monthLabel}</p>
    <svg viewBox="0 0 200 100" style="width:100%; max-width:240px;">
      <path d="M20,90 A80,80 0 0 1 180,90" fill="none" stroke="#E4E8EC" stroke-width="13" stroke-linecap="round" pathLength="100"/>
      ${has ? `
        <path d="M20,90 A80,80 0 0 1 180,90" fill="none" stroke="#2E6E8E" stroke-width="13" stroke-linecap="round" pathLength="100"
          stroke-dasharray="${split.cngPct} ${100-split.cngPct}" stroke-dashoffset="0"/>
        <path d="M20,90 A80,80 0 0 1 180,90" fill="none" stroke="#B85C2C" stroke-width="13" stroke-linecap="round" pathLength="100"
          stroke-dasharray="${split.petrolPct} ${100-split.petrolPct}" stroke-dashoffset="${-split.cngPct}"/>
      ` : ""}
      <text x="100" y="80" text-anchor="middle" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#1C2431">
        ${has ? inr(totalSpend) : "No data"}
      </text>
    </svg>
    <div style="display:flex; gap:20px; margin-top:2px;">
      <span style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--inkmute);"><span class="dot dot-cng"></span>CNG <strong style="color:var(--ink);">${split.cngPct}%</strong></span>
      <span style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--inkmute);"><span class="dot dot-petrol"></span>Petrol <strong style="color:var(--ink);">${split.petrolPct}%</strong></span>
    </div>
  </div>`;
}

function renderMonthly(){
  const el = document.getElementById("monthly-list");
  const months = monthlySummaries();
  if (!months.length){ document.getElementById("monthly-card").classList.add("hidden"); return; }
  document.getElementById("monthly-card").classList.remove("hidden");
  el.innerHTML = months.map(m => `
    <div>
      <span style="font-weight:600;">${m.month}</span>
      <span style="color:var(--inkmute);">${m.km.toLocaleString("en-IN")} km</span>
      <span class="mono" style="font-weight:600;">${inr(m.fuelSpend + m.serviceSpend)}</span>
    </div>`).join("");
}

/* ---------------- Fuel: ADD (home) ---------------- */
function setAddFuelType(t){
  addFuelType = t;
  document.getElementById("fueladd-toggle-cng").classList.toggle("active-cng", t==="CNG");
  document.getElementById("fueladd-toggle-petrol").classList.toggle("active-petrol", t==="Petrol");
  document.getElementById("fueladd-qty-label").textContent = t==="CNG" ? "Quantity (kg)" : "Quantity (L)";
}
function resetFuelAddForm(){
  document.getElementById("fueladd-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("fueladd-odo").value = "";
  document.getElementById("fueladd-qty").value = "";
  document.getElementById("fueladd-cost").value = "";
  document.getElementById("fueladd-notes").value = "";
  setAddFuelType("CNG");
}
async function submitFuelAdd(e){
  e.preventDefault();
  const errEl = document.getElementById("fueladd-error");
  errEl.classList.add("hidden");
  const odo = Number(document.getElementById("fueladd-odo").value);
  const qty = Number(document.getElementById("fueladd-qty").value);
  const cost = Number(document.getElementById("fueladd-cost").value);
  const date = document.getElementById("fueladd-date").value;
  const notes = document.getElementById("fueladd-notes").value || null;
  if (!odo || !qty || !cost){
    errEl.textContent = "Odometer, quantity and cost are required.";
    errEl.classList.remove("hidden");
    return false;
  }
  const lastOdo = fuelLogs.length ? Math.max(...fuelLogs.map(f=>f.odometer_km)) : 0;
  if (lastOdo && odo < lastOdo){
    errEl.textContent = `Odometer can't be less than your last reading (${lastOdo} km).`;
    errEl.classList.remove("hidden");
    return false;
  }
  const payload = { entry_date: date, odometer_km: odo, fuel_type: addFuelType, quantity: qty, cost, notes };
  const btn = document.getElementById("fueladd-submit-btn");
  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = await sb.from("car_fuel_logs").insert(payload);
  btn.disabled = false; btn.textContent = "Save fill-up";
  if (error){
    errEl.textContent = error.message;
    errEl.classList.remove("hidden");
    return false;
  }
  resetFuelAddForm();
  await loadAll();
  return false;
}

  const cost = Number(document.getElementById("fueledit-cost").value);

  loadAll();
}
function renderFuelList(){
  const el = document.getElementById("fuel-list");
  if (!fuelLogs.length){ el.innerHTML = `<p style="color:var(--inkmute); font-size:14px;">No fill-ups logged yet.</p>`; return; }
  const sorted = [...fuelLogs].sort((a,b)=>b.odometer_km-a.odometer_km);
  el.innerHTML = sorted.map(l => `
    <div>
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <span class="dot ${l.fuel_type==='CNG'?'dot-cng':'dot-petrol'}"></span>
        <div style="min-width:0;">
          <p style="font-size:14px; font-weight:600; margin:0;">${l.fuel_type} · ${l.quantity}${l.fuel_type==='CNG'?'kg':'L'}</p>
          <p style="font-size:12px; color:var(--inkmute); margin:2px 0 0;">${l.entry_date} · ${l.odometer_km.toLocaleString("en-IN")} km</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
        <span class="mono" style="font-size:14px; font-weight:600;">${inr(l.cost)}</span>
        <button class="btn-ghost" onclick="startFuelEdit('${l.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteFuel('${l.id}')">Delete</button>
      </div>
    </div>
  `).join("");
}
